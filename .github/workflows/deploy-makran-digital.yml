# Each push creates a fresh run with one github-pages artifact.
name: Deploy Makran Digital to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'makran-digital/**'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'birthday-admin.html'
      - 'birthday-results-schema.sql'
      - '.github/workflows/deploy-makran-digital.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Makran Digital site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
